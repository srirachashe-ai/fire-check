const TODAY=(()=>{const b=bkk();return Date.UTC(b.getUTCFullYear(),b.getUTCMonth(),b.getUTCDate())})();

try{const v=JSON.parse(localStorage.getItem('fe-ident')||'{}');S.dept=v.dept||'';S.emp=v.emp||''}catch(e){}

const byCode=(a,b)=>{const pa=a.c.split('-'),pb=b.c.split('-');return pa[1]===pb[1]?(+pa[2]-+pb[2]):ZORD.indexOf(pa[1])-ZORD.indexOf(pb[1])};

const bk=t=>{const d=dl(t);if(d==null)return null;return d<0?'EXPIRED':d<=90?'D90':d<=365?'Y1':d<=1095?'PLAN':'LATER'};
const isAdmin=()=>OWNER||UNLOCK;
let UNLOCK=false,UNLOCK_H='',pwFails=0,pwWait=0;
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const unhex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
async function pwHash(pw,salt,iter){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:unhex(salt),iterations:iter,hash:'SHA-256'},k,256))}
function rememberUnlock(){UNLOCK_H=CFG.admPw.hash.slice(0,16);try{localStorage.setItem('fe-adm',JSON.stringify({h:CFG.admPw.hash.slice(0,16),exp:Date.now()+12*36e5}))}catch(e){}}
function checkUnlock(){let v=null;try{v=JSON.parse(localStorage.getItem('fe-adm')||'null')}catch(e){}const cur=CFG.admPw?CFG.admPw.hash.slice(0,16):'';UNLOCK=!!cur&&(UNLOCK_H===cur||!!(v&&v.h===cur&&v.exp>Date.now()))}
function lockOffice(){UNLOCK=false;UNLOCK_H='';try{localStorage.removeItem('fe-adm')}catch(e){}S.mode='field';go('home')}
async function setPw(){
  const a=S.pw1||'',b=S.pw2||'';if(a.length<6){toast('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร');return}if(a!==b){toast('รหัสผ่านทั้งสองช่องไม่ตรงกัน');return}
  const salt=hex(crypto.getRandomValues(new Uint8Array(16))),iter=150000;S.busy='กำลังบันทึกรหัสผ่าน…';render();
  try{const hash=await pwHash(a,salt,iter),pw={salt,iter,hash,at:nowISO()};const old=CFG.admPw;CFG.admPw=pw;rememberUnlock();if(!OWNER)UNLOCK=true;try{await wq(()=>DB.doc('cfg/main').update({admPw:pw}))}catch(e){CFG.admPw=old;checkUnlock();throw e}S.pw1=S.pw2='';S.busy='';render();toast('บันทึกรหัสผ่านหลังบ้านแล้ว')}catch(e){S.busy='';toast(errMsg(e))}
}
async function tryUnlock(){
  const pw=S.pwIn||'';if(Date.now()<pwWait){S.pwErr=`ใส่ผิดหลายครั้ง รออีก ${Math.ceil((pwWait-Date.now())/1000)} วินาที`;render();return}
  if(!CFG.admPw){S.pwErr='ยังไม่ได้ตั้งรหัสผ่านหลังบ้าน ติดต่อเจ้าของระบบ';render();return}
  if(!pw){S.pwErr='ใส่รหัสผ่าน';render();return}
  S.pwErr='กำลังตรวจสอบ…';render();
  const h=await pwHash(pw,CFG.admPw.salt,CFG.admPw.iter);
  if(h===CFG.admPw.hash){UNLOCK=true;pwFails=0;rememberUnlock();S.pwBox=false;S.pwIn='';S.pwErr='';S.mode='office';go('osum');toast('เข้าสู่หลังบ้านแล้ว')}
  else{pwFails++;S.pwIn='';if(pwFails>=5){pwWait=Date.now()+30000;pwFails=0}S.pwErr='รหัสผ่านไม่ถูกต้อง';render()}
}
const actor=()=>S.emp||ME.name||'ผู้ดูแลระบบ';

async function loadRound(r){if(OI[r]||OI['_'+r])return;OI['_'+r]=1;try{const s=await DB.collection('insp').where('round','==',r).get();OI[r]=new Map(s.docs.map(d=>[d.id,{id:d.id,...d.data()}]))}catch(e){OI[r]=new Map()}delete OI['_'+r];render()}
async function loadHist(c){if(H[c])return;H[c]='loading';try{const s=await DB.collection('insp').where('c','==',c).get();H[c]=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.status!=='draft').sort((a,b)=>a.round<b.round?1:-1)}catch(e){H[c]=[]}render()}

/* ---------- photos ---------- */
async function shrink(file,stamp){
  try{const bmp=await createImageBitmap(file);const sc=Math.min(1,1600/Math.max(bmp.width,bmp.height));const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);const cx=cv.getContext('2d');cx.drawImage(bmp,0,0,cv.width,cv.height);
    if(stamp){const fs=Math.max(16,Math.round(cv.width/38)),pad=Math.round(fs*.6),lines=stamp.slice(0,3);cx.font=`600 ${fs}px "IBM Plex Sans Thai",sans-serif`;const bh=lines.length*fs*1.35+pad*2;cx.fillStyle='rgba(0,0,0,.6)';cx.fillRect(0,cv.height-bh,cv.width,bh);cx.fillStyle='#fff';cx.textBaseline='top';lines.forEach((l,i)=>cx.fillText(l,pad,cv.height-bh+pad+i*fs*1.35,cv.width-pad*2))}
    return await new Promise(r=>cv.toBlob(b=>r(b||file),'image/jpeg',.82))}catch(e){return file}
}
function stampFor(c,who){const t=tk(c)||{l:''};return[`${c} · ${t.l}`.slice(0,70),`ตรวจเมื่อ ${new Date().toLocaleString('th-TH',{timeZone:TZ,day:'numeric',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'})} น.`,`โดย ${who||actor()}`]}
async function uploadFiles(files,stamp,times){
  if(!AS){toast('บัญชีนี้แนบรูปไม่ได้ ติดต่อผู้ดูแลระบบ');return[]}
  const ids=[];S.busy='กำลังอัปโหลดรูป…';render();
  try{for(const f of files){const b=await shrink(f,stamp);if(times)times.push(f.lastModified?new Date(f.lastModified).toISOString():nowISO());const r=await AS.upload(b,{type:b.type==='image/jpeg'?'image/jpeg':(['image/png','image/webp','image/gif'].includes(b.type)?b.type:'image/jpeg')});ids.push(r.id)}}
  catch(e){toast(e&&e.code==='too_large'?'รูปใหญ่เกินไป':'อัปโหลดรูปไม่สำเร็จ ลองใหม่')}
  S.busy='';render();return ids;
}

/* ---------- QR ---------- */
async function decodeQR(file){
  const bmp=await createImageBitmap(file);
  if('BarcodeDetector' in window){try{const r=await new BarcodeDetector({formats:['qr_code']}).detect(bmp);if(r&&r[0])return r[0].rawValue}catch(e){}}
  await lib('jsqr');
  for(const max of [1000,1600,700]){const sc=Math.min(1,max/Math.max(bmp.width,bmp.height));const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);const cx=cv.getContext('2d');cx.drawImage(bmp,0,0,cv.width,cv.height);const d=cx.getImageData(0,0,cv.width,cv.height);const r=window.jsQR(d.data,cv.width,cv.height,{inversionAttempts:'attemptBoth'});if(r&&r.data)return r.data}
  return null;
}
async function onQR(file){
  S.busy='กำลังอ่าน QR…';render();let txt=null;
  try{txt=await decodeQR(file)}catch(e){}
  S.busy='';const m=txt&&String(txt).toUpperCase().match(/E-[A-Z]{2}-\d+/);
  if(!m){toast('อ่าน QR ไม่ได้ ถ่ายให้ใกล้และชัดขึ้น หรือพิมพ์รหัสถังแทน');return}

async function pdfQR(zone,list){

    const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait'});

    (S.img?`<div class="ov" data-a="imgx"><img src="${esc(bl(S.img))}" alt="รูปขยาย"></div>`:'')+
    (S.busy?`<div class="busy" role="status">${esc(S.busy)}</div>`:'')+(S.toast?`<div class="toast" role="status">${esc(S.toast)}</div>`:'');
  if(fid){const n=document.getElementById(fid);if(n&&n!==document.activeElement){n.focus({preventScroll:true});try{if(ss!=null)n.setSelectionRange(ss,se)}catch(e){}}}
}
function confirmBox(msg,ok,fn){S.conf={msg,ok,fn};render()}

/* ---------- events ---------- */
document.addEventListener('click',async ev=>{
  const el=ev.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;

  case 'nav':if(S.ins&&!S.ins.edit){clearTimeout(dT);saveDraft()}S.ins=null;go(el.dataset.v);break;
  case 'more':S.lim+=40;render();break;
  case 'scan':liveScan();break;
  case 'identEdit':S.editIdent=true;render();break;

  case 'pwNo':S.pwBox=false;S.pwErr='';render();break;

  case 'pwSet':setPw();break;
  case 'zv':S.zv=el.dataset.z;render();break;
  case 'expGo':if(isAdmin()){S.mode='office';S.eb='EXPIRED';go('oexp')}else go('reg');break;
  case 'tank':go('tank',el.dataset.c);break;
  case 'start':startIns(el.dataset.c);break;
  case 'res':{const n=+el.dataset.i,i=S.ins.items[n];i.r=el.dataset.r;i.e='';render();draftSoon();if(i.r==='PASS'){const nx=S.ins.items.findIndex((x,k)=>k>n&&!x.r);const c=nx>=0&&document.getElementById('qi-'+nx);if(c)c.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'})}break}
  case 'allpass':S.ins.items.forEach(i=>{if(!i.r){i.r='PASS';i.e=''}});render();draftSoon();break;
  case 'rmproof':S.ins.proof.splice(+el.dataset.j,1);S.ins.proofT.splice(+el.dataset.j,1);render();draftSoon();break;
  case 'rmph':{const i=S.ins.items[+el.dataset.i];i.ph.splice(+el.dataset.j,1);render();draftSoon();break}
  case 'img':S.img=el.dataset.id;render();break;
  case 'imgx':S.img=null;render();break;
  case 'review':if(validate()){S.rev=true;window.scrollTo(0,0)}render();break;
  case 'redit':S.rev=false;render();break;
  case 'submit':submit();break;
  case 'cancelIns':{const x=S.ins;clearTimeout(dT);if(x&&!x.edit)await saveDraft();S.ins=null;go(S.mode==='office'?'ores':'tank',S.mode==='office'?undefined:x&&x.c);break}
  case 'dtab':S.dtab=el.dataset.t;S.lim=40;render();break;
  case 'dtabGo':S.dtab=el.dataset.t;go('defects');break;
  case 'defect':if(isAdmin())S.mode='office';go('defect',el.dataset.id);break;
  case 'dst':await dUpd(S.a,{s:'IN_PROGRESS'},'IN_PROGRESS');toast('เริ่มดำเนินการแล้ว');break;
  case 'dfix':{const d=D.find(x=>x.id===S.a);const act=(S.dAct[d.id]!=null?S.dAct[d.id]:d.act||'').trim();
    if(!act){S.err='ระบุวิธีแก้ไขก่อนแจ้งว่าแก้ไขแล้ว';render();break}
    if(AS&&!(d.aph||[]).length){S.err='ถ่ายรูปหลังแก้ไขอย่างน้อย 1 รูป';render();break}
    S.err='';await dUpd(d.id,{s:'RESOLVED',act},'RESOLVED');delete S.dAct[d.id];toast('แจ้งว่าแก้ไขแล้ว รอผู้ดูแลยืนยันปิดงาน');break}
  case 'dclose':await dUpd(S.a,{s:'CLOSED',closedBy:actor(),closedAt:nowISO()},'CLOSED');toast('ปิดงานแล้ว');break;
  case 'dreopen':await dUpd(S.a,{s:'IN_PROGRESS'},'IN_PROGRESS');toast('เปิดงานใหม่แล้ว');break;
  case 'ddel':confirmBox('ลบรายการข้อบกพร่องนี้ถาวร? ประวัติการแก้ไขจะหายไปด้วย','ลบรายการ',async()=>{try{await wq(()=>DB.doc('defects/'+S.a).delete());go('defects');toast('ลบแล้ว')}catch(e){toast(errMsg(e))}});break;
  case 'cok':{const f=S.conf.fn;S.conf=null;render();await f();break}
  case 'cno':S.conf=null;render();break;
  case 'rf':S.rf=el.dataset.f;go('ores');break;
  case 'rfc':S.rf=el.dataset.f;S.lim=40;render();break;
  case 'eb':S.eb=el.dataset.b;go('oexp');break;
  case 'idetOpen':S.mode=isAdmin()?'office':S.mode;go('idet',el.dataset.id);break;
  case 'iedit':{const round=S.a.split('_')[0],x=roundMap(round).get(S.a);startIns(x.c,x);break}
  case 'idel':confirmBox('ลบผลตรวจนี้? ถังจะกลับเป็น "ยังไม่ตรวจ" ในรอบนั้น (รายการข้อบกพร่องที่สร้างไว้ยังอยู่)','ลบผลตรวจ',async()=>{const id=S.a,round=id.split('_')[0];try{await wq(()=>DB.doc('insp/'+id).delete());if(round!==R)delete OI[round];H[id.slice(round.length+1)]=undefined;go('ores');toast('ลบผลตรวจแล้ว')}catch(e){toast(errMsg(e))}});break;
  case 'tnew':S.tf={isNew:true,c:'E-',l:'',t:'Chemical',m:'',sz:'15',cls:'',fr:'',active:true,note:''};go('tedit');break;
  case 'tedit':{const t=tk(el.dataset.c);S.tf={isNew:false,c:t.c,l:t.l,t:t.t,m:t.m||'',sz:t.sz||'',cls:t.cls||'',fr:t.fr||'',active:t.active!==false,note:t.note||''};go('tedit');break}
  case 'tsave':{const f=S.tf,c=f.c.trim().toUpperCase(),m=String(f.m).trim();
    if(!/^E-[A-Z]{2}-\d+$/.test(c)){S.err='รหัสถังต้องเป็นรูปแบบ E-XX-ตัวเลข เช่น E-PD-45';render();break}
    const z=c.split('-')[1];if(!ZN[z]){S.err='รหัสพื้นที่ '+z+' ไม่รู้จัก ใช้ PD, WH, FN, EN, AM, LB หรือ SA';render();break}
    if(f.isNew&&T.has(c)){S.err='มีรหัสถัง '+c+' อยู่แล้ว';render();break}
    if(!f.l.trim()){S.err='ระบุสถานที่ติดตั้ง';render();break}
    if(m&&!/^25\d\d$/.test(m)){S.err='ปีผลิตต้องเป็นปี พ.ศ. 4 หลัก เช่น 2568';render();break}
    try{await wq(()=>DB.doc('tanks/'+c).set({l:f.l.trim(),t:f.t,m:m?+m:null,z,sz:+String(f.sz).trim()||null,cls:String(f.cls).trim().toUpperCase(),fr:String(f.fr).trim(),active:!!f.active,note:f.note.trim()}));S.tf=null;go('otank');toast('บันทึกถัง '+c+' แล้ว')}catch(e){toast(errMsg(e))}break}
  case 'empAddDept':{const n=S.nd.trim();if(!n)break;if(!(n in S.empEdit))S.empEdit[n]='';S.nd='';render();break}
  case 'empDelDept':{const d=el.dataset.d;confirmBox(`ลบหน่วยงาน "${d}" ออกจากรายการแก้ไข? (มีผลเมื่อกดบันทึก)`,'ลบ',()=>{delete S.empEdit[d];render()});break}
  case 'empReset':S.empEdit=null;render();break;
  case 'empSave':{const emp={};for(const d in S.empEdit){emp[d]=[...new Set(S.empEdit[d].split('\n').map(s=>s.trim()).filter(Boolean))]}
    try{await wq(()=>DB.doc('cfg/main').set({...CFG,emp}));S.empEdit=null;toast('บันทึกรายชื่อพนักงานแล้ว')}catch(e){toast(errMsg(e))}break}
  case 'admAdd':{const u=el.dataset.u,ad=[...new Set([...(CFG.admins||[]),u])];try{await wq(()=>DB.doc('cfg/main').update({admins:ad}));toast('เพิ่มผู้ดูแลแล้ว')}catch(e){toast(errMsg(e))}break}
  case 'admDel':{const u=el.dataset.u;try{await wq(()=>DB.doc('cfg/main').update({admins:(CFG.admins||[]).filter(x=>x!==u)}));toast('ถอนสิทธิ์แล้ว')}catch(e){toast(errMsg(e))}break}
  case 'setSave':{const lf=+(S.sLife!=null?S.sLife:life()),url=(S.sUrl!=null?S.sUrl:CFG.baseUrl||'').trim();
    if(!(lf>=1&&lf<=30)){toast('อายุใช้งานต้องเป็น 1–30 ปี');break}
    if(url&&!/^https:\/\//.test(url)){toast('ลิงก์ต้องขึ้นต้นด้วย https://');break}
    try{await wq(()=>DB.doc('cfg/main').update({life:lf,baseUrl:url}));S.sLife=S.sUrl=null;toast('บันทึกการตั้งค่าแล้ว')}catch(e){toast(errMsg(e))}break}
  case 'xRound':xRound(S.or);break;
  case 'pdfRound':pdfRound(S.or);break;
  case 'xTanks':xTanks();break;
  case 'xDefects':xDefects();break;
  case 'pdfQR':pdfQR(S.qrz);break;
  case 'qrPdf':{const q=S.qq.toLowerCase();pdfQR(S.qrz,actT().filter(t=>(!S.qrz||t.z===S.qrz)&&(!q||(t.c+' '+t.l+' '+t.t).toLowerCase().includes(q))));break}
  case 'qrPng':pngQR(el.dataset.c);break;
  }
});
let admT;
document.addEventListener('input',ev=>{
  const t=ev.target,k=t.dataset&&t.dataset.in;if(!k)return;
  if(k==='q'){S.q=t.value;$('#qres').innerHTML=qres()}
  else if(k==='tq'||k==='tz'){S[k]=t.value;S.lim=40;render()}
  else if(k==='det'){S.ins.items[+t.dataset.i].d=t.value;draftSoon()}
  else if(k==='na'){S.ins.items[+t.dataset.i].n=t.value;draftSoon()}
  else if(k==='note'){S.ins.note=t.value.slice(0,500);draftSoon()}
  else if(k==='act'){S.dAct[S.a]=t.value}
  else if(k==='tf'){const f=t.dataset.f;S.tf[f]=f==='active'?t.value==='1':t.value}
  else if(k==='empt'){S.empEdit[t.dataset.d]=t.value}
  else if(k==='nd'){S.nd=t.value}
  else if(k==='slife'){S.sLife=t.value}else if(k==='surl'){S.sUrl=t.value}
  else if(k==='pwin'){S.pwIn=t.value}
  else if(k==='pw1'){S.pw1=t.value}else if(k==='pw2'){S.pw2=t.value}
  else if(k==='qq'){S.qq=t.value;S.lim=40;render()}
  else if(k==='admq'){S.admQ=t.value;clearTimeout(admT);admT=setTimeout(async()=>{S.admHits=U&&S.admQ.trim()?await U.search(S.admQ.trim()):[];const n=$('#admhits');if(n)n.innerHTML=admHitsHtml()},250)}
});
document.addEventListener('change',async ev=>{
  const t=ev.target,k=t.dataset&&t.dataset.in;
  if(t.id==='qrfile'){const f=t.files&&t.files[0];t.value='';if(f)onQR(f);return}
  if(!k)return;
  if(k==='pick'){S.pick=t.value;render()}
  else if(k==='dept'){S.dept=t.value;S.emp='';saveIdent();render()}
  else if(k==='emp'){S.emp=t.value;S.editIdent=false;saveIdent();render()}
  else if(k==='or'){S.or=t.value;S.lim=40;render()}
  else if(k==='qrz'){S.qrz=t.value}
  else if(k==='qrzv'){S.qrz=t.value;S.lim=40;render()}
  else if(k==='who'){await dUpd(S.a,{who:t.value})}
  else if(k==='act'){const v=t.value;await dUpd(S.a,{act:v});delete S.dAct[S.a]}
  else if(k==='proof'){const fs=[...t.files];t.value='';const x=S.ins;const tm=[];const ids=await uploadFiles(fs,stampFor(x.c,x.emp),tm);if(S.ins===x&&ids.length){x.proof.push(...ids);x.proofT.push(...tm.slice(0,ids.length));x.pe='';render();draftSoon()}}
  else if(k==='ph'){const fs=[...t.files];t.value='';const n=+t.dataset.i;const ids=await uploadFiles(fs,S.ins&&stampFor(S.ins.c,S.ins.emp));if(S.ins&&ids.length){S.ins.items[n].ph.push(...ids);S.ins.items[n].e='';render();draftSoon()}}
  else if(k==='aph'){const fs=[...t.files];t.value='';const id=S.a;const dd=D.find(x=>x.id===id);const ids=await uploadFiles(fs,dd&&['หลังแก้ไข · '+stampFor(dd.c)[0],stampFor(dd.c)[1],stampFor(dd.c)[2]]);const d=D.find(x=>x.id===id);if(d&&ids.length){await dUpd(id,{aph:[...(d.aph||[]),...ids]});S.err=''}}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='admpw'){ev.preventDefault();tryUnlock();return}if(ev.key==='Escape'&&S.pwBox){S.pwBox=false;render();return}if(ev.key==='Escape'&&(S.img||S.conf)){S.img=null;S.conf=null;render()}});
function onHash(){const h=(location.hash||'').slice(1).toUpperCase();if(/^E-[A-Z]{2}-\d+$/.test(h)){if(READY)openCode(h);else S.pendingHash=h}}
window.addEventListener('hashchange',onHash);
let tipEl=null;function showTip(el,x,y){const[a,b,c]=el.dataset.tip.split('|');if(!tipEl){tipEl=document.createElement('div');tipEl.className='tip';tipEl.setAttribute('role','status');document.body.appendChild(tipEl)}tipEl.innerHTML=`<b>${esc(a)}</b>${esc(b)} · ${esc(c)}`;const w=tipEl.offsetWidth,h=tipEl.offsetHeight;tipEl.style.left=Math.max(8,Math.min(innerWidth-w-8,x-w/2))+'px';tipEl.style.top=Math.max(8,y-h-12)+'px'}
function hideTip(){if(tipEl){tipEl.remove();tipEl=null}}
document.addEventListener('pointermove',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el&&e.pointerType!=='touch')showTip(el,e.clientX,e.clientY);else if(!el)hideTip()});
document.addEventListener('pointerdown',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el&&e.pointerType==='touch'){const r=el.getBoundingClientRect();showTip(el,r.left+r.width/2,r.top);setTimeout(hideTip,1800)}});

/* ---------- boot ---------- */
const use=n=>window.claude&&window.claude.use?window.claude.use(n).catch(()=>null):Promise.resolve(null);
async function boot(){
  render();
  [DB,U,AS,DL]=await Promise.all(['db','user','assets','downloads'].map(use));
  if(!DB){FATAL=GH?'เชื่อมต่อฐานข้อมูลไม่ได้ ตรวจการเชื่อมต่ออินเทอร์เน็ต หรือแจ้งผู้ดูแลให้ตรวจไฟล์ firebase-config.js':'เปิดหน้านี้ใน Claude โดยเข้าสู่ระบบด้วยบัญชีที่ได้รับเชิญ จึงจะบันทึกและดูผลตรวจได้';render();return}
  if(U){try{ME=await U.me();OWNER=!!ME.isOwner}catch(e){}}
  const ready=()=>{if(!READY&&got.t&&got.c&&got.i&&got.d)READY=true;if(READY&&S.pendingHash){const h=S.pendingHash;S.pendingHash=null;openCode(h)}render()};
  const fail=e=>{if(e&&e.code==='revoked'){FATAL='สิทธิ์การเข้าถึงหน้านี้เปลี่ยนไป รีเฟรชหน้าเพื่อเข้าใหม่';render()}};
  DB.collection('tanks').onSnapshot(s=>{T=new Map(s.docs.map(d=>[d.id,{c:d.id,...d.data()}]));got.t=true;ready()},fail);
  DB.doc('cfg/main').onSnapshot(s=>{const v=s.exists?s.data():{};CFG={emp:v.emp||{},life:v.life||5,baseUrl:v.baseUrl||'',admins:v.admins||[],admPw:v.admPw||null};checkUnlock();got.c=true;ready()},fail);
  DB.collection('insp').where('round','==',R).onSnapshot(s=>{I=new Map(s.docs.map(d=>[d.id,{id:d.id,...d.data()}]));got.i=true;ready()},fail);
  DB.collection('defects').onSnapshot(s=>{D=s.docs.map(d=>({id:d.id,...d.data()}));got.d=true;ready()},fail);
  onHash();
}
boot();
})();
